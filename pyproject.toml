[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-curate"
version = "0.1.0"
description = "Corpus curation with TypeSafe Jev — pass/fail gates, curated vs rejected JSONL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jev-curate contributors" }]
keywords = ["jev", "typesafe", "data-curation", "filtering", "training-data"]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jev-curate = "jev_curate.cli:main"

[project.urls]
Homepage = "https://github.com/ThyFriendlyFox/jev-curate"
Repository = "https://github.com/ThyFriendlyFox/jev-curate"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_curate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
